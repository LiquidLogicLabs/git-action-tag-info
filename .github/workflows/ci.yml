name: CI

on:
  push:
    paths-ignore: ['**/*.md']
    branches: ['**']
    tags-ignore: ['**']  # Ignore tag pushes (handled by release workflow)
  pull_request:
    paths-ignore: ['**/*.md']
    branches: ['**']
  workflow_call:  # Allow CI to be called by release workflow
  workflow_dispatch:  # Allow manual triggering

# Note: When called by release workflow, CI will run on the tag ref
# When triggered directly, CI should NOT run on tag pushes (release handles those)

concurrency:
  group: ${{ github.workflow || 'CI' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    # Runs for workflow_call/workflow_dispatch/push/PR; tag pushes are excluded by trigger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # registry-url makes setup-node write the auth .npmrc to RUNNER_TEMP, not the
        # workspace. Never append a token to a workspace .npmrc: act bind-mounts the
        # repo directory and never truncates it, which is how a live token reached a
        # public repo. Auth is supplied per-step via NODE_AUTH_TOKEN.
        #
        # scope is REQUIRED even though git-platform-detector is unscoped. Without it
        # setup-node writes a bare `registry=<gitea>` line, making Gitea the DEFAULT
        # registry; npm then rewrites every public package's resolved URL to that host
        # and `npm ci` dies with 404s (e.g. yocto-queue). With scope it writes
        # `@liquidlogiclabs:registry=<gitea>` instead, leaving the default registry as
        # npmjs. The private dep is a raw HTTPS tarball, so it needs no scope routing —
        # only the host-scoped `//git.ravenwolf.org/...:_authToken` line, which npm
        # applies to a direct tarball fetch on that host.
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://git.ravenwolf.org/api/packages/liquidlogiclabs/npm/'
          scope: '@liquidlogiclabs'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        # Non-blocking until Phase 6 reformats. Do not make this blocking here.
        continue-on-error: true
        run: npm run format:check

      - name: Reject duplicate forge workflow directories
        run: |
          # Gitea Actions runs .github/workflows/ — verified against a Gitea-hosted repo in
          # this set that has no .gitea/ directory and whose jobs run there successfully.
          # A second copy is not needed, and the one that existed had drifted badly: it had
          # missed every CI gate added to .github/, and all the defects found in this repo
          # set lived in it, because it is the copy no linter or scanner reads.
          # If a forge genuinely needs its own workflow, get that approved and add the
          # directory to the allowlist below with the reason.
          found=""
          for d in .gitea .forgejo .circleci .drone .woodpecker; do
            [ -e "$d" ] && found="$found $d"
          done
          if [ -n "$found" ]; then
            echo "::error::Duplicate forge workflow directory present:$found"
            echo "::error::.github/workflows/ is the single source for every forge."
            echo "::error::If this is deliberate, record the approved reason and amend this check."
            exit 1
          fi
          echo "No duplicate forge workflow directories."
      - name: Lint workflows
        # Scoped to ci.yml in Phase 0; Phase 1 fixes release.yml/e2e-tests.yml
        # shellcheck findings and removes the scoping.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/ci.yml

      - name: Scan for secrets
        run: |
          # Fail loudly if the mount is not a git repo — gitleaks exits 0 in that case.
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.30.1 \
            -c 'test -e /repo/.git' || { echo "::error::gitleaks mount is not a git repo"; exit 1; }
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    # No conditions needed - workflow trigger handles filtering
    needs: lint  # Tests run after lint
    uses: ./.github/workflows/test.yml
    secrets: inherit
    # test.yml runs: unit tests + integration tests (all tests except E2E)